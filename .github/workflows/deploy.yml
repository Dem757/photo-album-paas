name: Build and Deploy to OKD

on:
  push:
    branches: [ "main" ] 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3


  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./terraform
        env:
          KUBE_HOST: "https://api.okd.fured.cloud.bme.hu:6443"
          KUBE_TOKEN: ${{ secrets.OKD_TOKEN }}
          KUBE_INSECURE: "true"
          TF_VAR_okd_host: "https://api.okd.fured.cloud.bme.hu:6443"

      - name: Terraform Import Existing Resources
        run: |
          terraform import -input=false kubernetes_persistent_volume_claim_v1.postgres_pvc photo-album/postgres-pvc || true
          terraform import -input=false kubernetes_persistent_volume_claim_v1.media_pvc photo-album/media-pvc || true
          terraform import -input=false kubernetes_service_v1.postgres_svc photo-album/postgres || true
          terraform import -input=false kubernetes_service_v1.django_svc photo-album/django || true
          terraform import -input=false kubernetes_deployment_v1.postgres photo-album/postgres || true
          terraform import -input=false kubernetes_deployment_v1.django photo-album/django || true
        working-directory: ./terraform
        env:
          KUBE_HOST: "https://api.okd.fured.cloud.bme.hu:6443"
          KUBE_TOKEN: ${{ secrets.OKD_TOKEN }}
          KUBE_INSECURE: "true"
          TF_VAR_okd_host: "https://api.okd.fured.cloud.bme.hu:6443"
          TF_VAR_okd_token: ${{ secrets.OKD_TOKEN }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_django_image: "image-registry.openshift-image-registry.svc:5000/photo-album/django:latest"
          TF_VAR_namespace: "photo-album"

      - name: Remove stale Route state
        run: terraform state rm kubernetes_manifest.django_route || true
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        working-directory: ./terraform
        env:
          KUBE_HOST: "https://api.okd.fured.cloud.bme.hu:6443"
          KUBE_TOKEN: ${{ secrets.OKD_TOKEN }}
          KUBE_INSECURE: "true"
          TF_VAR_okd_host: "https://api.okd.fured.cloud.bme.hu:6443"
          TF_VAR_okd_token: ${{ secrets.OKD_TOKEN }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_django_image: "image-registry.openshift-image-registry.svc:5000/photo-album/django:latest"
          TF_VAR_namespace: "photo-album"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Create Django Route
        run: |
          kubectl --server="https://api.okd.fured.cloud.bme.hu:6443" --token="${{ secrets.OKD_TOKEN }}" --insecure-skip-tls-verify=true apply -f - <<'EOF'
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: django
            namespace: photo-album
          spec:
            host: django-photo-album.apps.okd.fured.cloud.bme.hu
            to:
              kind: Service
              name: django
            port:
              targetPort: http
            tls:
              termination: edge
          EOF
        working-directory: ./terraform

      - name: Restart Django Deployment
        run: |
          kubectl --server="https://api.okd.fured.cloud.bme.hu:6443" --token="${{ secrets.OKD_TOKEN }}" --insecure-skip-tls-verify=true -n photo-album rollout restart deployment/django
          kubectl --server="https://api.okd.fured.cloud.bme.hu:6443" --token="${{ secrets.OKD_TOKEN }}" --insecure-skip-tls-verify=true -n photo-album rollout status deployment/django --timeout=10m

      - name: Run Django Migrations
        run: |
          for i in {1..20}; do
            pod_name=$(kubectl --server="https://api.okd.fured.cloud.bme.hu:6443" --token="${{ secrets.OKD_TOKEN }}" --insecure-skip-tls-verify=true -n photo-album get pods -l app=django --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$pod_name" ]; then
              echo "Using pod: $pod_name"
              kubectl --server="https://api.okd.fured.cloud.bme.hu:6443" --token="${{ secrets.OKD_TOKEN }}" --insecure-skip-tls-verify=true -n photo-album exec "$pod_name" -- python manage.py migrate --noinput && exit 0
            fi
            echo "Waiting for a running django pod... ($i/20)"
            sleep 10
          done
          echo "No stable running django pod found to execute migrations"
          kubectl --server="https://api.okd.fured.cloud.bme.hu:6443" --token="${{ secrets.OKD_TOKEN }}" --insecure-skip-tls-verify=true -n photo-album get pods -l app=django -o wide || true
          exit 1